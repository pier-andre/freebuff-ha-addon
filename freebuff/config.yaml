name: "Freebuff CLI"
version: "0.2.8"
slug: "freebuff"
description: "Agent de code Freebuff dans un terminal web, pour coder vos add-ons et vos dépôts Git"
url: "https://github.com/pier-andre/freebuff-ha-addon/tree/main/freebuff"
arch:
  - amd64
  - aarch64
init: false
ingress: true
ingress_port: 8099
ingress_stream: true
panel_icon: "mdi:console-line"
panel_title: "Freebuff"
panel_admin: true
startup: application
map:
  - local_apps:rw
  - homeassistant_config:rw
  - share:rw
options:
  git_name: ""
  git_email: ""
  extra_packages: []
  github_token: ""
  home_assistant_token: ""
schema:
  git_name: str?
  git_email: email?
  extra_packages:
    - str
  github_token: password?
  home_assistant_token: password?
