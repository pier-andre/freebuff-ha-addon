name: "Freebuff CLI"
version: "0.2.14"
slug: "freebuff"
description: "Agent de code Freebuff dans un terminal web, pour coder vos add-ons et vos dépôts Git"
url: "https://github.com/pier-andre/freebuff-ha-addon/tree/main/freebuff"
arch:
  - amd64
  - aarch64
init: false
ingress: true
ingress_port: 8099
ingress_stream: true
panel_icon: "mdi:console-line"
panel_title: "Freebuff"
panel_admin: true
startup: application
# Le proxy Supervisor de l'API Core (http://supervisor/core) sert de repli quand
# aucun jeton longue durée n'est configuré : l'agent peut alors valider la
# configuration HA (homeassistant.check_config) sans qu'aucun secret ne soit stocké.
homeassistant_api: true
map:
  - local_apps:rw
  - homeassistant_config:rw
  - share:rw
options:
  git_name: ""
  git_email: ""
  extra_packages: []
  github_token: ""
  home_assistant_url: ""
  home_assistant_port: 8123
  home_assistant_token: ""
  ha_mcp_enabled: true
  ha_mcp_url: ""
  ha_mcp_token: ""
  n8n_mcp_enabled: false
  n8n_mcp_url: ""
  n8n_mcp_token: ""
schema:
  git_name: str?
  git_email: email?
  extra_packages:
    - str
  github_token: password?
  home_assistant_url: str?
  home_assistant_port: port?
  home_assistant_token: password?
  ha_mcp_enabled: bool
  ha_mcp_url: str?
  ha_mcp_token: password?
  n8n_mcp_enabled: bool
  n8n_mcp_url: str?
  n8n_mcp_token: password?
