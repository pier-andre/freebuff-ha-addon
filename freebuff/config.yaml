name: "Freebuff CLI"
version: "0.2.19"
slug: "freebuff"
description: "Agent de code Freebuff dans un terminal web, pour coder vos add-ons et vos dépôts Git"
url: "https://github.com/pier-andre/freebuff-ha-addon/tree/main/freebuff"
arch:
  - amd64
  - aarch64
init: false
ingress: true
ingress_port: 8099
ingress_stream: true
panel_icon: "mdi:console-line"
panel_title: "Freebuff"
panel_admin: true
startup: application
# Le proxy Supervisor de l'API Core (http://supervisor/core) sert de repli quand
# aucun jeton longue durée n'est configuré : l'agent peut alors valider la
# configuration HA (homeassistant.check_config) sans qu'aucun secret ne soit stocké.
homeassistant_api: true
# Journaux des autres add-ons, du Supervisor, de Home Assistant Core et de
# l'hôte : l'API Supervisor (`/addons/<slug>/logs`, `/supervisor/logs`,
# `/core/logs`, `/host/logs`) ne sert ces chemins qu'aux add-ons déclarant
# `hassio_api` et le rôle `manager`. Sans ces deux lignes, seuls
# `/addons/self/...` et `/info` répondent (403 constaté sur `/addons`, `/core`,
# `/supervisor` en 0.2.18) : c'est ce qui suffisait à `ex`, pas à la lecture des
# journaux. Le rôle `manager` abaisse la note de sécurité affichée par Home
# Assistant et ouvre d'autres chemins que les journaux (`/store`, `/docker`,
# `/backups`, `/host`) : l'add-on ne s'en sert que pour les journaux, et son
# panneau reste réservé aux administrateurs (`panel_admin`).
hassio_api: true
hassio_role: manager
map:
  - local_apps:rw
  - homeassistant_config:rw
  - share:rw
options:
  git_name: ""
  git_email: ""
  extra_packages: []
  github_token: ""
  home_assistant_url: ""
  home_assistant_port: 8123
  home_assistant_token: ""
  ha_mcp_enabled: true
  ha_mcp_url: ""
  ha_mcp_token: ""
  n8n_mcp_enabled: false
  n8n_mcp_url: ""
  n8n_mcp_token: ""
  # Anciennes options, conservées le temps de la migration vers ha_mcp_* : le
  # Supervisor supprime de options.json toute option absente du schéma, donc les
  # retirer ici effacerait l'URL et le jeton enregistrés avant même que
  # mcp-config.sh puisse les reprendre. À ne retirer qu'une fois ha_mcp_url et
  # ha_mcp_token renseignés (vérifiable dans /data/options.json).
  mcp_url: ""
  mcp_token: ""
schema:
  git_name: str?
  git_email: email?
  extra_packages:
    - str
  github_token: password?
  home_assistant_url: str?
  home_assistant_port: port?
  home_assistant_token: password?
  ha_mcp_enabled: bool
  ha_mcp_url: str?
  ha_mcp_token: password?
  n8n_mcp_enabled: bool
  n8n_mcp_url: str?
  n8n_mcp_token: password?
  mcp_url: str?
  mcp_token: password?
