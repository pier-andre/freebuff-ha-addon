<!-- freebuff-mobile — correctifs mobiles insérés par build-index.mjs dans la page servie
     par ttyd 1.7.7.
     La page d'origine n'a ni balise viewport, ni défilement tactile, et cache son
     champ de saisie hors écran — d'où une conversation impossible à faire défiler
     au doigt et des claviers à prédiction (SwiftKey, Gboard) qui perdent leur
     composition. Rien n'est modifié dans le terminal lui-même : on n'ajoute que
     du CSS et des écouteurs d'événements. -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: #000;
    overscroll-behavior: none;
    -webkit-text-size-adjust: 100%;
  }

  /* Le champ caché de xterm est déporté à left:-9999em avec une taille nulle :
     iOS y place mal le curseur d'IME et les claviers à prédiction perdent leur
     composition. On le garde dans la page, minuscule mais à sa place, et à 16px
     (en dessous, Safari zoome à la prise de focus). */
  .xterm .xterm-helper-textarea {
    left: 0 !important;
    top: 0 !important;
    width: 1px !important;
    height: 1px !important;
    font-size: 16px !important;
    opacity: 0 !important;
    pointer-events: none !important;
  }

  /* Le défilement est assuré par le script ci-dessous : on coupe les gestes
     natifs sur la zone du terminal (rebond élastique, sélection, zoom). */
  .xterm, .xterm-screen, .xterm-viewport {
    touch-action: none;
    overscroll-behavior: contain;
  }

  /* Bouton « Coller » : ttyd n'en fournit aucun, et le champ de saisie de xterm
     est volontairement invisible (1 px, transparent). Sur téléphone, aucune
     cible ne permet donc d'appui long pour ouvrir le menu « Coller » du
     système. Le bouton est fixé en haut de la page, jamais recouvert par le
     clavier. */
  #freebuff-paste {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 8px);
    right: calc(env(safe-area-inset-right, 0px) + 8px);
    z-index: 10000;
    margin: 0;
    padding: 10px 14px;
    font: 600 15px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: #fff;
    background: rgba(24, 24, 27, 0.85);
    border: 1px solid rgba(255, 255, 255, 0.3);
    border-radius: 999px;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }

  #freebuff-paste-panel {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 8px);
    left: calc(env(safe-area-inset-left, 0px) + 8px);
    right: calc(env(safe-area-inset-right, 0px) + 8px);
    z-index: 10001;
    display: none;
    max-height: 60vh;
    overflow: auto;
    padding: 10px;
    background: rgba(24, 24, 27, 0.97);
    border: 1px solid rgba(255, 255, 255, 0.25);
    border-radius: 12px;
  }

  #freebuff-paste-panel.freebuff-open {
    display: block;
  }

  /* 16 px : en dessous, Safari zoome à la prise de focus. */
  #freebuff-paste-field {
    display: block;
    width: 100%;
    box-sizing: border-box;
    min-height: 90px;
    padding: 8px;
    font: 16px/1.35 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: #fff;
    background: #000;
    border: 1px solid rgba(255, 255, 255, 0.3);
    border-radius: 8px;
    resize: none;
    -webkit-user-select: text;
    user-select: text;
  }

  .freebuff-paste-actions {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
    margin-top: 8px;
  }

  .freebuff-paste-actions button {
    margin: 0;
    padding: 9px 16px;
    font: 600 15px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: #fff;
    background: #2563eb;
    border: 0;
    border-radius: 8px;
    cursor: pointer;
    touch-action: manipulation;
  }

  .freebuff-paste-actions .freebuff-paste-cancel {
    background: #3f3f46;
  }
</style>
<script>
(function () {
  "use strict";

  var TERMINAL = ".xterm";
  var PX_PER_NOTCH = 14;   // glissement (px) nécessaire pour un cran de molette
  var WHEEL_DELTA = 120;   // un cran tel que xterm le comprend
  var FLICK_SPEED = 0.45;  // px/ms au-delà desquels on ajoute de l'inertie

  function terminal() {
    return document.querySelector(TERMINAL);
  }

  // xterm écoute `wheel` sur .xterm : un événement synthétique est traité
  // exactement comme une molette physique. Quand le programme du terminal suit
  // la souris (tmux avec `mouse on`, TUI), xterm transmet le cran en séquences
  // SGR ; sinon il fait défiler son propre buffer.
  function notch(direction, x, y) {
    var el = terminal();
    if (!el) return;
    el.dispatchEvent(new WheelEvent("wheel", {
      deltaY: direction * WHEEL_DELTA,
      deltaMode: 0,
      clientX: x,
      clientY: y,
      bubbles: true,
      cancelable: true,
      view: window
    }));
  }

  var touch = null;

  document.addEventListener("touchstart", function (event) {
    if (event.touches.length !== 1 || !(event.target instanceof Element) ||
        !event.target.closest(TERMINAL)) {
      touch = null;
      return;
    }
    var t = event.touches[0];
    touch = {
      startX: t.clientX,
      startY: t.clientY,
      x: t.clientX,
      y: t.clientY,
      time: event.timeStamp,
      pending: 0,
      active: false,
      speed: 0
    };
  }, { capture: true, passive: true });

  document.addEventListener("touchmove", function (event) {
    if (!touch || event.touches.length !== 1) return;
    var t = event.touches[0];
    if (!touch.active) {
      var dx = t.clientX - touch.startX;
      var dy = t.clientY - touch.startY;
      // Sous 6 px on ne sait pas encore si c'est un défilement : on laisse le
      // navigateur gérer (un simple appui doit pouvoir ouvrir le clavier).
      if (Math.abs(dx) < 6 && Math.abs(dy) < 6) return;
      if (Math.abs(dx) > Math.abs(dy)) { touch = null; return; } // geste horizontal
      touch.active = true;
    }
    event.preventDefault(); // ni rebond, ni sélection, ni « tirer pour rafraîchir »
    touch.pending += touch.y - t.clientY;
    var elapsed = Math.max(1, event.timeStamp - touch.time);
    touch.speed = (touch.y - t.clientY) / elapsed;
    touch.x = t.clientX;
    touch.y = t.clientY;
    touch.time = event.timeStamp;
    while (Math.abs(touch.pending) >= PX_PER_NOTCH) {
      var direction = touch.pending > 0 ? 1 : -1;
      touch.pending -= direction * PX_PER_NOTCH;
      notch(direction, touch.x, touch.y);
    }
  }, { capture: true, passive: false });

  function release() {
    if (!touch) return;
    var speed = touch.speed;
    var x = touch.x;
    var y = touch.y;
    var active = touch.active;
    touch = null;
    if (!active || Math.abs(speed) < FLICK_SPEED) return;
    // Un geste rapide continue de défiler un peu, comme une molette lancée.
    var direction = speed > 0 ? 1 : -1;
    var remaining = Math.min(12, Math.round(Math.abs(speed) * 8));
    (function step() {
      if (remaining-- <= 0) return;
      notch(direction, x, y);
      window.requestAnimationFrame(step);
    })();
  }

  document.addEventListener("touchend", release, { capture: true, passive: true });
  document.addEventListener("touchcancel", release, { capture: true, passive: true });

  // Claviers à prédiction : xterm ne gère pas la composition IME de façon
  // fiable (doublons et texte tronqué quand le clavier remplace le contenu du
  // champ). On désactive autocorrection et majuscules automatiques — les
  // commandes sont sensibles à la casse — et on annonce une touche d'envoi pour
  // que « Entrée » arrive telle quelle.
  var INPUT_ATTRIBUTES = {
    autocomplete: "off",
    autocorrect: "off",
    autocapitalize: "off",
    spellcheck: "false",
    enterkeyhint: "send",
    inputmode: "text"
  };

  function tuneInput() {
    var field = document.querySelector(".xterm-helper-textarea");
    if (!field) return;
    for (var name in INPUT_ATTRIBUTES) {
      if (field.getAttribute(name) !== INPUT_ATTRIBUTES[name]) {
        field.setAttribute(name, INPUT_ATTRIBUTES[name]);
      }
    }
  }

  document.addEventListener("focusin", tuneInput, true);
  document.addEventListener("DOMContentLoaded", tuneInput);
  window.addEventListener("load", tuneInput);
  setTimeout(tuneInput, 500);
  setTimeout(tuneInput, 2000);

  // --- Collage ----------------------------------------------------------------
  // ttyd n'a pas de bouton coller et son champ de saisie est invisible : au
  // doigt, il n'existe aucune cible pour un appui long, donc le menu « Coller »
  // du système ne s'ouvre jamais. Deux voies, dans cet ordre :
  //   1. l'API presse-papiers, disponible quand l'Ingress est servi en HTTPS :
  //      lecture directe puis envoi au terminal ;
  //   2. un champ de collage fixé en HAUT de la page, donc jamais recouvert par
  //      le clavier, où l'appui long ouvre le menu habituel.
  // L'envoi passe par `window.term.paste()` de ttyd : xterm écrit dans le pty
  // comme pour un collage clavier (collage entre crochets de bash/tmux compris).
  var PASTE_ID = "freebuff-paste";
  var PASTE_PANEL_ID = "freebuff-paste-panel";
  var PASTE_FIELD_ID = "freebuff-paste-field";
  var pastePanel = null;

  function sendToTerminal(text) {
    if (!text) return false;
    var term = window.term;
    if (term && typeof term.paste === "function") {
      term.paste(text);
    } else {
      // ttyd n'expose plus window.term : xterm écoute aussi `paste` sur .xterm
      // et y lit clipboardData. Repli sans garantie selon le navigateur.
      var data = null;
      try {
        data = new DataTransfer();
        data.setData("text/plain", text);
      } catch (error) {
        data = null;
      }
      var el = terminal();
      if (!el || !data) return false;
      el.dispatchEvent(new ClipboardEvent("paste", {
        bubbles: true,
        cancelable: true,
        clipboardData: data
      }));
    }
    if (term && typeof term.focus === "function") {
      try {
        term.focus();
      } catch (error) {
        // terminal déjà détruit (page en cours de fermeture)
      }
    }
    return true;
  }

  function openPastePanel() {
    if (!pastePanel) return;
    var field = document.getElementById(PASTE_FIELD_ID);
    pastePanel.classList.add("freebuff-open");
    if (field) {
      field.value = "";
      field.focus(); // clavier ouvert : le champ reste en haut, donc visible
    }
  }

  function closePastePanel() {
    if (pastePanel) pastePanel.classList.remove("freebuff-open");
  }

  function submitPastePanel() {
    var field = document.getElementById(PASTE_FIELD_ID);
    if (!field) return;
    var text = field.value;
    if (!text) {
      closePastePanel();
      return;
    }
    // Si le terminal n'est pas encore prêt, on garde le texte dans le champ.
    if (!sendToTerminal(text)) return;
    field.value = "";
    closePastePanel();
  }

  function buildPasteUi() {
    if (!document.body || document.getElementById(PASTE_ID)) return;

    var button = document.createElement("button");
    button.id = PASTE_ID;
    button.type = "button";
    button.textContent = "Coller";
    button.setAttribute("aria-label", "Coller le presse-papiers dans le terminal");
    button.addEventListener("click", function () {
      if (navigator.clipboard && typeof navigator.clipboard.readText === "function") {
        navigator.clipboard.readText().then(function (text) {
          if (!sendToTerminal(text)) openPastePanel();
        }, openPastePanel);
      } else {
        // Contexte non sécurisé (HTTP) ou API absente : champ de collage.
        openPastePanel();
      }
    });

    pastePanel = document.createElement("div");
    pastePanel.id = PASTE_PANEL_ID;
    pastePanel.innerHTML =
      '<textarea id="' + PASTE_FIELD_ID + '" rows="3" ' +
        'autocapitalize="off" autocorrect="off" spellcheck="false" ' +
        'placeholder="Collez ici (appui long) puis Envoyer"></textarea>' +
      '<div class="freebuff-paste-actions">' +
        '<button type="button" class="freebuff-paste-cancel">Annuler</button>' +
        '<button type="button" class="freebuff-paste-send">Envoyer</button>' +
      '</div>';

    pastePanel.querySelector(".freebuff-paste-send")
      .addEventListener("click", submitPastePanel);
    pastePanel.querySelector(".freebuff-paste-cancel")
      .addEventListener("click", closePastePanel);

    document.body.appendChild(button);
    document.body.appendChild(pastePanel);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", buildPasteUi);
  } else {
    buildPasteUi();
  }
  window.addEventListener("load", buildPasteUi);
  setTimeout(buildPasteUi, 2000);

  // --- Clavier virtuel --------------------------------------------------------
  // Sur téléphone, le clavier ne réduit pas la page : la vue visuelle
  // (visualViewport) rétrécit alors que html et body gardent leur hauteur, si
  // bien que la dernière ligne du terminal — la ligne de saisie et la barre
  // d'état de tmux — reste cachée sous le clavier. On cale la hauteur de la page
  // sur la vue visuelle, puis on redemande à xterm de recalculer ses lignes
  // (`window.term.fit()`, exposé par ttyd) : la nouvelle taille part vers le
  // pty, tmux se réajuste et la ligne de saisie remonte au-dessus du clavier.
  var viewportFrame = 0;

  function fitToViewport() {
    viewportFrame = 0;
    var view = window.visualViewport;
    if (!view) return;
    var height = Math.round(view.height);
    if (height < 1) return;
    document.documentElement.style.height = height + "px";
    if (document.body) document.body.style.height = height + "px";
    var term = window.term;
    if (!term || typeof term.fit !== "function") return;
    try {
      term.fit();
      // `fit()` change le nombre de lignes sans déplacer le viewport : sans ce
      // recentrage, le curseur peut rester sous le clavier après le calcul.
      if (typeof term.scrollToBottom === "function") term.scrollToBottom();
    } catch (error) {
      // terminal pas encore ouvert (page en cours de chargement)
    }
  }

  function scheduleFit() {
    if (viewportFrame) return;
    viewportFrame = window.requestAnimationFrame
      ? window.requestAnimationFrame(fitToViewport)
      : setTimeout(fitToViewport, 0);
  }

  if (window.visualViewport) {
    window.visualViewport.addEventListener("resize", scheduleFit);
    // iOS déplace aussi la vue visuelle quand le clavier s'ouvre : sans cet
    // écouteur, aucun `resize` n'est émis et rien n'est recalculé.
    window.visualViewport.addEventListener("scroll", scheduleFit);
  }
  window.addEventListener("resize", scheduleFit);
  window.addEventListener("orientationchange", scheduleFit);
  // Le clavier s'ouvre après un délai d'animation sur certaines versions : on
  // repasse une fois l'animation terminée, et au retour du clavier.
  document.addEventListener("focusin", function (event) {
    if (!(event.target instanceof Element)) return;
    if (!event.target.closest("textarea, input")) return;
    setTimeout(scheduleFit, 300);
  }, true);
  document.addEventListener("focusout", scheduleFit, true);
  setTimeout(scheduleFit, 500);
  setTimeout(scheduleFit, 2000);
  scheduleFit();
})();
</script>
