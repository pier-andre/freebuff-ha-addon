# Session tmux de l'add-on Freebuff.

# La molette — y compris les crans synthétisés par le défilement tactile de la
# page web — entre en mode copie et fait défiler l'historique de la session.
set -g mouse on

# Le terminal web est le seul écran : garder assez d'historique pour remonter
# une longue conversation de l'agent.
set -g history-limit 50000

# Un Échap seul doit être reconnu tout de suite (vim, TUI) au lieu d'attendre
# une éventuelle séquence de touches.
set -g escape-time 10
